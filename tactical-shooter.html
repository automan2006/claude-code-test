<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tactical Shooter</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    cursor: none;
  }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
</style>
<canvas id="c"></canvas>
<script>
// ─── CANVAS SETUP ────────────────────────────────
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

const W = 960, H = 640;
const WORLD_W = 2400, WORLD_H = 1800;
canvas.width = W;
canvas.height = H;

function resize() {
  const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width = (W * scale) + 'px';
  canvas.style.height = (H * scale) + 'px';
}
window.addEventListener('resize', resize);
resize();

// ─── INPUT ────────────────────────────────────────
const keys = new Set();
const mouse = { x: W/2, y: H/2, down: false, clicked: false };
let mouseOnCanvas = false;

window.addEventListener('keydown', e => {
  keys.add(e.key.toLowerCase());
  e.preventDefault();
});
window.addEventListener('keyup', e => {
  keys.delete(e.key.toLowerCase());
  e.preventDefault();
});
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  mouse.x = (e.clientX - rect.left) * (W / rect.width);
  mouse.y = (e.clientY - rect.top) * (H / rect.height);
  mouseOnCanvas = true;
});
canvas.addEventListener('mousedown', e => { if (e.button === 0) mouse.down = true; });
canvas.addEventListener('mouseup', e => { if (e.button === 0) mouse.down = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('mouseleave', () => { mouseOnCanvas = false; mouse.down = false; });
canvas.addEventListener('mouseenter', () => { mouseOnCanvas = true; });

// ─── UTILITY ──────────────────────────────────────
function dist(a, b) { return Math.sqrt((a.x-b.x)**2 + (a.y-b.y)**2); }
function angleTo(a, b) { return Math.atan2(b.y - a.y, b.x - a.x); }
function lerp(a, b, t) { return a + (b - a) * t; }
function rand(min, max) { return min + Math.random() * (max - min); }
function randInt(min, max) { return Math.floor(rand(min, max+1)); }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

// ─── SPRITE SYSTEM ───────────────────────────────
function buildSprite(w, h, blocksFn) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const cx = c.getContext('2d');
  cx.imageSmoothingEnabled = false;
  const px = (x, y, color) => { cx.fillStyle = color; cx.fillRect(x, y, 1, 1); };
  blocksFn(px);
  return c;
}

    // Claws
    px(2,15,'#ff4444');px(2,16,'#ff4444');px(3,16,'#ff4444');px(1,16,'#ff4444');
    px(23,15,'#ff4444');px(23,16,'#ff4444');px(24,16,'#ff4444');px(25,16,'#ff4444');
    // Legs
    for (let y=19;y<=32;y++) {
      px(8+bob,y,'#3a2a4a');px(9+bob,y,'#3a2a4a');px(10+bob,y,'#3a2a4a');px(11+bob,y,'#3a2a4a');
      px(14-bob,y,'#3a2a4a');px(15-bob,y,'#3a2a4a');px(16-bob,y,'#3a2a4a');px(17-bob,y,'#3a2a4a');
    }
    // Boots
    px(6,31,'#2a1a2a');px(7,32,'#2a1a2a');px(8,33,'#2a1a2a');px(9,33,'#2a1a2a');px(10,33,'#2a1a2a');px(11,33,'#2a1a2a');px(12,33,'#2a1a2a');
    px(13,31,'#2a1a2a');px(14,32,'#2a1a2a');px(15,33,'#2a1a2a');px(16,33,'#2a1a2a');px(17,33,'#2a1a2a');px(18,33,'#2a1a2a');px(19,33,'#2a1a2a');
  });
}

// Build sprite animations
const playerFrames = [0,1,2,3].map(f => buildPlayerFrame(f));
const zombieFrames = [0,1,2,3].map(f => buildZombieFrame(f));
const runnerFrames = [0,1,2,3].map(f => buildRunnerFrame(f));
const tankFrames = [0,1].map(f => buildTankFrame(f));
const SPRITE_SCALE = 3;

// ─── PARTICLE POOL ────────────────────────────
const MAX_PARTICLES = 400;
const particles = [];
for (let i = 0; i < MAX_PARTICLES; i++) {
  particles.push({ active: false, x:0,y:0,vx:0,vy:0,life:0,maxLife:0,color:'#fff',size:2 });
}

function spawnParticle(x, y, vx, vy, life, color, size) {
  for (const p of particles) {
    if (!p.active) {
      p.active = true; p.x = x; p.y = y; p.vx = vx; p.vy = vy;
      p.life = life; p.maxLife = life; p.color = color; p.size = size || 2;
      return;
    }
  }
  // Overwrite oldest if pool full
  let oldest = particles[0];
  for (const p of particles) { if (p.life < oldest.life) oldest = p; }
  oldest.active = true; oldest.x = x; oldest.y = y; oldest.vx = vx; oldest.vy = vy;
  oldest.life = life; oldest.maxLife = life; oldest.color = color; oldest.size = size || 2;
}

function burstParticles(x, y, count, speed, life, colors, sizes) {
  for (let i = 0; i < count; i++) {
    const angle = rand(0, Math.PI * 2);
    const spd = rand(speed * 0.3, speed);
    const color = colors[randInt(0, colors.length - 1)];
    const size = Array.isArray(sizes) ? rand(sizes[0], sizes[1]) : (sizes || 2);
    spawnParticle(x, y, Math.cos(angle) * spd, Math.sin(angle) * spd, rand(life*0.4, life), color, size);
  }
}

// ─── ENTITY FACTORIES ──────────────────────────
function createPlayer() {
  return {
    x: WORLD_W/2, y: WORLD_H/2,
    vx: 0, vy: 0,
    rotation: 0,
    speed: 220,
    health: 100, maxHealth: 100,
    ammo: 8, maxAmmo: 8,
    reloadTimer: 0, reloadDuration: 1.2,
    shootCooldown: 0, shootCooldownDuration: 0.22,
    isReloading: false,
    invulnTimer: 0,
    radius: 10,
    animFrame: 0, animTimer: 0,
  };
}

const ENEMY_DEFS = {
  zombie: { speed: 85, health: 1, damage: 12, radius: 9, points: 100 },
  runner: { speed: 190, health: 1, damage: 8, radius: 7, points: 200 },
  tank:   { speed: 55, health: 5, damage: 25, radius: 16, points: 500 },
};

function createEnemy(type, x, y, diffMult) {
  const d = ENEMY_DEFS[type];
  return {
    x, y, type,
    speed: d.speed * diffMult,
    health: Math.ceil(d.health * diffMult),
    maxHealth: Math.ceil(d.health * diffMult),
    damage: d.damage,
    radius: d.radius,
    points: d.points,
    animFrame: 0, animTimer: 0,
    state: 'alive',
    deathTimer: 0,
    flashTimer: 0,
    knockbackX: 0, knockbackY: 0,
  };
}

function createBullet(x, y, angle) {
  return {
    x, y,
    vx: Math.cos(angle) * 600,
    vy: Math.sin(angle) * 600,
    lifetime: 0.8,
    radius: 2,
    trail: [],
  };
}

// ─── LEVEL CONFIGS ─────────────────────────────
const LEVELS = [
  { targetKills: 10, maxEnemies: 5,  spawnInterval: 2.0, types: { zombie: 1.0, runner: 0, tank: 0 }, diffMult: 1.0 },
  { targetKills: 15, maxEnemies: 8,  spawnInterval: 1.7, types: { zombie: 0.7, runner: 0.3, tank: 0 }, diffMult: 1.1 },
  { targetKills: 20, maxEnemies: 12, spawnInterval: 1.4, types: { zombie: 0.5, runner: 0.35, tank: 0.15 }, diffMult: 1.2 },
  { targetKills: 25, maxEnemies: 15, spawnInterval: 1.2, types: { zombie: 0.35, runner: 0.4, tank: 0.25 }, diffMult: 1.35 },
  { targetKills: 30, maxEnemies: 20, spawnInterval: 0.9, types: { zombie: 0.25, runner: 0.4, tank: 0.35 }, diffMult: 1.5 },
];

// ─── GAME STATE ─────────────────────────────────
const game = {
  state: 'MENU', // MENU | PLAYING | LEVEL_TRANSITION | GAME_OVER
  player: null,
  enemies: [],
  bullets: [],
  camera: { x: 0, y: 0 },
  level: 1,
  kills: 0,
  totalKills: 0,
  score: 0,
  targetKills: 0,
  maxEnemies: 5,
  spawnInterval: 2.0,
  diffMult: 1.0,
  enemyTypeWeights: {},
  screenShake: { intensity: 0, duration: 0 },
  spawnTimer: 0,
  transitionTimer: 0,
  gameOverTimer: 0,
  won: false,
  frameCount: 0,
};

function initLevel(levelNum) {
  const cfg = LEVELS[levelNum - 1];
  game.level = levelNum;
  game.targetKills = cfg.targetKills;
  game.kills = 0;
  game.maxEnemies = cfg.maxEnemies;
  game.spawnInterval = cfg.spawnInterval;
  game.diffMult = cfg.diffMult;
  game.enemyTypeWeights = { ...cfg.types };
  game.enemies = [];
  game.bullets = [];
  game.spawnTimer = 0;
  // Deactivate particles
  for (const p of particles) p.active = false;
  // Heal player
  if (game.player) {
    game.player.health = Math.min(game.player.maxHealth, game.player.health + 35);
    game.player.ammo = game.player.maxAmmo;
    game.player.isReloading = false;
    game.player.reloadTimer = 0;
  }
}

function startGame() {
  game.player = createPlayer();
  game.totalKills = 0;
  game.score = 0;
  game.won = false;
  game.camera.x = game.player.x - W/2;
  game.camera.y = game.player.y - H/2;
  initLevel(1);
  game.state = 'PLAYING';
}

function pickEnemyType() {
  const w = game.enemyTypeWeights;
  const r = Math.random();
  if (r < w.zombie) return 'zombie';
  if (r < w.zombie + (w.runner||0)) return 'runner';
  return 'tank';
}

function spawnEnemy() {
  if (game.enemies.length >= game.maxEnemies) return;
  const type = pickEnemyType();
  const cam = game.camera;
  const margin = 60;
  // Pick a random edge
  const edge = randInt(0, 3);
  let x, y;
  switch (edge) {
    case 0: x = rand(cam.x - margin, cam.x + W + margin); y = cam.y - margin; break;
    case 1: x = cam.x + W + margin; y = rand(cam.y - margin, cam.y + H + margin); break;
    case 2: x = rand(cam.x - margin, cam.x + W + margin); y = cam.y + H + margin; break;
    case 3: x = cam.x - margin; y = rand(cam.y - margin, cam.y + H + margin); break;
  }
  x = clamp(x, 0, WORLD_W);
  y = clamp(y, 0, WORLD_H);
  game.enemies.push(createEnemy(type, x, y, game.diffMult));
}

// ─── COLLISION ──────────────────────────────────
function circlesCollide(a, b) {
  const dx = a.x - b.x, dy = a.y - b.y;
  return Math.sqrt(dx*dx + dy*dy) < (a.radius || 0) + (b.radius || 0);
}

// ─── UPDATE ─────────────────────────────────────
function update(dt) {
  // Clamp dt
  dt = Math.min(dt, 0.1);

  const g = game;

  // Screen shake decay
  if (g.screenShake.duration > 0) {
    g.screenShake.duration -= dt;
    g.screenShake.intensity *= Math.pow(0.001, dt);
    if (g.screenShake.duration <= 0) g.screenShake.intensity = 0;
  }

  if (g.state === 'MENU') return;
  if (g.state === 'LEVEL_TRANSITION') {
    g.transitionTimer -= dt;
    if (g.transitionTimer <= 0) {
      if (g.level > LEVELS.length) {
        g.state = 'GAME_OVER';
        g.won = true;
        g.gameOverTimer = 1.0;
      } else {
        initLevel(g.level);
        g.state = 'PLAYING';
      }
    }
    // Still update particles
    updateParticles(dt);
    return;
  }
  if (g.state === 'GAME_OVER') {
    updateParticles(dt);
    return;
  }

  const p = g.player;

  // ── Player movement ──
  let moveX = 0, moveY = 0;
  if (keys.has('arrowleft') || keys.has('a')) moveX = -1;
  if (keys.has('arrowright') || keys.has('d')) moveX = 1;
  if (keys.has('arrowup') || keys.has('w')) moveY = -1;
  if (keys.has('arrowdown') || keys.has('s')) moveY = 1;
  const moveLen = Math.sqrt(moveX*moveX + moveY*moveY);
  if (moveLen > 1) { moveX /= moveLen; moveY /= moveLen; }
  p.x += moveX * p.speed * dt;
  p.y += moveY * p.speed * dt;
  p.x = clamp(p.x, p.radius, WORLD_W - p.radius);
  p.y = clamp(p.y, p.radius, WORLD_H - p.radius);

  // Animation
  if (moveLen > 0.1) {
    p.animTimer += dt;
    if (p.animTimer > 0.12) { p.animTimer = 0; p.animFrame = (p.animFrame + 1) % 4; }
  } else {
    p.animTimer += dt;
    if (p.animTimer > 0.3) { p.animTimer = 0; p.animFrame = (p.animFrame + 1) % 2; }
  }

  // Aim toward mouse (world space)
  const worldMouseX = mouse.x + g.camera.x;
  const worldMouseY = mouse.y + g.camera.y;
  p.rotation = Math.atan2(worldMouseY - p.y, worldMouseX - p.x);

  // Reload
  if (p.isReloading) {
    p.reloadTimer -= dt;
    if (p.reloadTimer <= 0) {
      p.ammo = p.maxAmmo;
      p.isReloading = false;
    }
  }
  // Auto reload at 0 ammo
  if (p.ammo <= 0 && !p.isReloading) {
    p.isReloading = true;
    p.reloadTimer = p.reloadDuration;
  }
  // Manual reload with R
  if (keys.has('r') && !p.isReloading && p.ammo < p.maxAmmo) {
    p.isReloading = true;
    p.reloadTimer = p.reloadDuration;
  }

  // Shooting
  p.shootCooldown -= dt;
  if (p.shootCooldown <= 0) p.shootCooldown = 0;
  if (mouse.down && p.shootCooldown <= 0 && p.ammo > 0 && !p.isReloading && mouseOnCanvas) {
    p.shootCooldown = p.shootCooldownDuration;
    p.ammo--;
    const barrelDist = 18;
    const bx = p.x + Math.cos(p.rotation) * barrelDist;
    const by = p.y + Math.sin(p.rotation) * barrelDist;
    g.bullets.push(createBullet(bx, by, p.rotation));
    // Muzzle flash
    burstParticles(bx, by, 6, 300, 0.13, ['#ffaa00','#ff6600','#ff4400','#ffff00'], [1,3]);
  }

  // Invulnerability
  if (p.invulnTimer > 0) p.invulnTimer -= dt;

  // ── Camera ──
  const targetCX = p.x - W/2;
  const targetCY = p.y - H/2;
  g.camera.x += (targetCX - g.camera.x) * 0.08;
  g.camera.y += (targetCY - g.camera.y) * 0.08;
  g.camera.x = clamp(g.camera.x, 0, WORLD_W - W);
  g.camera.y = clamp(g.camera.y, 0, WORLD_H - H);

  // ── Spawn enemies ──
  g.spawnTimer -= dt;
  if (g.spawnTimer <= 0 && g.enemies.length < g.maxEnemies) {
    spawnEnemy();
    g.spawnTimer = g.spawnInterval * (0.8 + Math.random() * 0.4);
  }

  // ── Update bullets ──
  for (let i = g.bullets.length - 1; i >= 0; i--) {
    const b = g.bullets[i];
    b.trail.push({ x: b.x, y: b.y });
    if (b.trail.length > 6) b.trail.shift();
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.lifetime -= dt;
    // Remove if off world or expired
    if (b.lifetime <= 0 || b.x < -50 || b.x > WORLD_W+50 || b.y < -50 || b.y > WORLD_H+50) {
      g.bullets.splice(i, 1);
    }
  }

  // ── Update enemies ──
  for (let i = g.enemies.length - 1; i >= 0; i--) {
    const e = g.enemies[i];

    if (e.state === 'dying') {
      e.deathTimer -= dt;
      if (e.deathTimer <= 0) {
        g.enemies.splice(i, 1);
      }
      continue;
    }

    if (e.flashTimer > 0) e.flashTimer -= dt;

    // Knockback decay
    e.knockbackX *= Math.pow(0.01, dt);
    e.knockbackY *= Math.pow(0.01, dt);

    // Move toward player
    const ang = angleTo(e, p);
    const spd = e.speed;
    e.x += Math.cos(ang) * spd * dt + e.knockbackX * dt;
    e.y += Math.sin(ang) * spd * dt + e.knockbackY * dt;

    // Separation from nearby enemies
    for (let j = 0; j < g.enemies.length; j++) {
      if (i === j) continue;
      const o = g.enemies[j];
      if (o.state !== 'alive') continue;
      const d = dist(e, o);
      const minDist = (e.radius + o.radius) * 1.5;
      if (d < minDist && d > 0) {
        const pushX = (e.x - o.x) / d * 80 * dt;
        const pushY = (e.y - o.y) / d * 80 * dt;
        e.x += pushX;
        e.y += pushY;
      }
    }

    e.x = clamp(e.x, e.radius, WORLD_W - e.radius);
    e.y = clamp(e.y, e.radius, WORLD_H - e.radius);

    // Animation
    e.animTimer += dt;
    const animSpeed = e.type === 'runner' ? 0.06 : e.type === 'tank' ? 0.18 : 0.14;
    if (e.animTimer > animSpeed) { e.animTimer = 0; e.animFrame = (e.animFrame + 1) % (e.type === 'tank' ? 2 : 4); }

    // Enemy-player collision
    if (circlesCollide(e, p) && p.invulnTimer <= 0) {
      p.health -= e.damage;
      p.invulnTimer = 0.5;
      g.screenShake.intensity = Math.max(g.screenShake.intensity, 10);
      g.screenShake.duration = 0.3;
      burstParticles(p.x, p.y, 8, 120, 0.3, ['#ff0000','#ff4444','#ff8888'], [1,3]);
      // Push enemy back slightly
      const pa = angleTo(p, e);
      e.knockbackX = Math.cos(pa) * 200;
      e.knockbackY = Math.sin(pa) * 200;
      if (p.health <= 0) {
        p.health = 0;
        g.state = 'GAME_OVER';
        g.won = false;
        g.gameOverTimer = 1.5;
        burstParticles(p.x, p.y, 40, 300, 0.8, ['#ff0000','#ff4400','#ff8800','#ffff00'], [1,4]);
      }
    }
  }

  // ── Bullet-enemy collision ──
  for (let bi = g.bullets.length - 1; bi >= 0; bi--) {
    const b = g.bullets[bi];
    let hit = false;
    for (let ei = g.enemies.length - 1; ei >= 0; ei--) {
      const e = g.enemies[ei];
      if (e.state !== 'alive') continue;
      if (circlesCollide(b, e)) {
        e.health--;
        e.flashTimer = 0.08;
        // Knockback
        const ka = angleTo(b, e);
        e.knockbackX = Math.cos(ka) * 250;
        e.knockbackY = Math.sin(ka) * 250;
        // Impact particles
        burstParticles(b.x, b.y, 4, 150, 0.15, ['#ffffff','#ffff00','#ffaa00'], [1,2]);
        hit = true;
        if (e.health <= 0) {
          e.state = 'dying';
          e.deathTimer = 0.3;
          g.kills++;
          g.totalKills++;
          g.score += e.points;
          const deathColors = e.type === 'zombie' ? ['#7a9a5c','#5a3a4a','#ff4444'] :
                              e.type === 'runner' ? ['#6a2030','#ffcc00','#ff4444'] :
                              ['#4a3a5a','#5a4a6a','#ff4444'];
          burstParticles(e.x, e.y, 18, 250, 0.5, deathColors, [1,3]);
          // Check level complete
          if (g.kills >= g.targetKills) {
            g.level++;
            if (g.level > LEVELS.length) {
              g.state = 'LEVEL_TRANSITION';
              g.transitionTimer = 2.5;
            } else {
              g.state = 'LEVEL_TRANSITION';
              g.transitionTimer = 2.5;
            }
          }
        }
        break;
      }
    }
    if (hit) {
      g.bullets.splice(bi, 1);
    }
  }

  // ── Update particles ──
  updateParticles(dt);
}

function updateParticles(dt) {
  for (const p of particles) {
    if (!p.active) continue;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;
    if (p.life <= 0) p.active = false;
  }
}

// ─── RENDER ─────────────────────────────────────
function worldToScreen(wx, wy) {
  return { x: wx - game.camera.x, y: wy - game.camera.y };
}

function drawSprite(sprite, x, y, rotation, scale, alpha) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rotation);
  ctx.globalAlpha = alpha || 1;
  const sw = sprite.width * scale;
  const sh = sprite.height * scale;
  ctx.drawImage(sprite, -sw/2, -sh/2, sw, sh);
  ctx.restore();
}

function drawGround() {
  const cam = game.camera;
  // Subtle grid
  ctx.strokeStyle = '#0d1117';
  ctx.lineWidth = 1;
  const gridSize = 64;
  const startX = -(cam.x % gridSize);
  const startY = -(cam.y % gridSize);
  for (let x = startX; x < W + gridSize; x += gridSize) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = startY; y < H + gridSize; y += gridSize) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  // Random noise dots
  ctx.fillStyle = '#111820';
  for (let i = 0; i < 40; i++) {
    const nx = ((i * 137 + 42) % W);
    const ny = ((i * 251 + 87) % H);
    ctx.fillRect(nx, ny, 2, 2);
  }
}

function render() {
  ctx.clearRect(0, 0, W, H);

  // Background
  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0, 0, W, H);

  const g = game;

  if (g.state === 'MENU') {
    renderMenu();
    return;
  }

  // Screen shake offset
  let shakeX = 0, shakeY = 0;
  if (g.screenShake.intensity > 0.1) {
    shakeX = (Math.random() - 0.5) * g.screenShake.intensity * 2;
    shakeY = (Math.random() - 0.5) * g.screenShake.intensity * 2;
  }

  ctx.save();
  ctx.translate(shakeX, shakeY);

  // Ground
  drawGround();

  const p = g.player;

  // Helper to get screen pos
  const sx = (wx) => wx - g.camera.x;
  const sy = (wy) => wy - g.camera.y;

  // ── Particles behind ──
  for (const pt of particles) {
    if (!pt.active) continue;
    const alpha = pt.life / pt.maxLife;
    ctx.fillStyle = pt.color;
    ctx.globalAlpha = alpha;
    ctx.fillRect(sx(pt.x) - pt.size/2, sy(pt.y) - pt.size/2, pt.size, pt.size);
  }
  ctx.globalAlpha = 1;

  // ── Enemies ──
  for (const e of g.enemies) {
    const esx = sx(e.x), esy = sy(e.y);
    if (esx < -80 || esx > W+80 || esy < -80 || esy > H+80) continue;

    if (e.state === 'dying') {
      const alpha = Math.max(0, e.deathTimer / 0.3);
      const sc = SPRITE_SCALE + (1 - alpha) * 1.5;
      const frames = e.type === 'zombie' ? zombieFrames : e.type === 'runner' ? runnerFrames : tankFrames;
      drawSprite(frames[e.animFrame % frames.length], esx, esy,
        angleTo(e, p), sc, alpha);
      continue;
    }

    const frames = e.type === 'zombie' ? zombieFrames : e.type === 'runner' ? runnerFrames : tankFrames;
    // Flash when hit
    if (e.flashTimer > 0) {
      ctx.save();
      ctx.translate(esx, esy);
      ctx.rotate(angleTo(e, p));
      ctx.globalAlpha = 0.6;
      ctx.fillStyle = '#ffffff';
      const r = e.radius * SPRITE_SCALE * 0.8;
      ctx.fillRect(-r, -r, r*2, r*2);
      ctx.restore();
    }
    drawSprite(frames[e.animFrame % frames.length], esx, esy, angleTo(e, p), SPRITE_SCALE, 1);
  }

  // ── Player ──
  const psx = sx(p.x), psy = sy(p.y);
  const blinkOff = p.invulnTimer > 0 && Math.floor(p.invulnTimer * 20) % 2 === 0;
  if (!blinkOff) {
    drawSprite(playerFrames[p.animFrame % playerFrames.length], psx, psy, p.rotation, SPRITE_SCALE, 1);
    // Gun barrel flash on recent shot
    if (p.shootCooldown > p.shootCooldownDuration - 0.04 && p.shootCooldownDuration > 0) {
      const bx = psx + Math.cos(p.rotation) * 18 * SPRITE_SCALE / 3;
      const by = psy + Math.sin(p.rotation) * 18 * SPRITE_SCALE / 3;
      ctx.fillStyle = '#ffff88';
      ctx.globalAlpha = 0.9;
      ctx.beginPath();
      ctx.arc(bx, by, 5, 0, Math.PI*2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  // ── Bullets ──
  for (const b of g.bullets) {
    const bsx = sx(b.x), bsy = sy(b.y);
    // Trail
    if (b.trail.length > 1) {
      for (let t = 1; t < b.trail.length; t++) {
        const ta = t / b.trail.length;
        ctx.strokeStyle = `rgba(255,200,30,${ta*0.6})`;
        ctx.lineWidth = 1 + ta;
        ctx.beginPath();
        const t1 = worldToScreen(b.trail[t-1].x, b.trail[t-1].y);
        const t2 = worldToScreen(b.trail[t].x, b.trail[t].y);
        ctx.moveTo(t1.x, t1.y);
        ctx.lineTo(t2.x, t2.y);
        ctx.stroke();
      }
    }
    // Bullet dot
    ctx.fillStyle = '#ffff44';
    ctx.fillRect(bsx - 2, bsy - 2, 4, 4);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(bsx - 1, bsy - 1, 2, 2);
  }

  // ── Particles in front ──
  // (already rendered behind, but let's render muzzle-flash type in front)
  // Actually just re-render all particles that are close to camera
  // (simplification: all particles already handled behind)

  ctx.restore();

  // ── HUD ──
  renderHUD();

  // ── State overlays ──
  if (g.state === 'LEVEL_TRANSITION') renderLevelTransition();
  if (g.state === 'GAME_OVER') renderGameOver();
}

function renderHUD() {
  const p = game.player;
  if (!p) return;

  // Health bar
  const hbX = 16, hbY = 16, hbW = 200, hbH = 18;
  ctx.fillStyle = '#00000088';
  ctx.fillRect(hbX - 2, hbY - 2, hbW + 4, hbH + 4);
  ctx.fillStyle = '#331111';
  ctx.fillRect(hbX, hbY, hbW, hbH);
  const hpRatio = p.health / p.maxHealth;
  const hpColor = hpRatio > 0.5 ? `rgb(${Math.floor(255*(1-hpRatio)*2)},220,60)` :
                  hpRatio > 0.25 ? `rgb(255,${Math.floor(200*hpRatio*2)},30)` : '#ff2222';
  ctx.fillStyle = hpColor;
  ctx.fillRect(hbX, hbY, hbW * hpRatio, hbH);
  ctx.strokeStyle = '#666';
  ctx.lineWidth = 2;
  ctx.strokeRect(hbX, hbY, hbW, hbH);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 12px monospace';
  ctx.fillText('HP', hbX + 4, hbY + 13);
  ctx.fillText(`${Math.ceil(p.health)}/${p.maxHealth}`, hbX + hbW/2 - 20, hbY + 13);

  // Ammo display
  const amX = W - 180, amY = 16;
  ctx.fillStyle = '#00000088';
  ctx.fillRect(amX - 4, amY - 4, 168, 50, 4);
  ctx.fillStyle = p.isReloading ? '#ffaa00' : '#ffffff';
  ctx.font = 'bold 16px monospace';
  ctx.textAlign = 'right';
  ctx.fillText(`AMMO: ${p.ammo}/${p.maxAmmo}`, W - 24, amY + 16);
  ctx.textAlign = 'start';

  // Reload bar
  if (p.isReloading) {
    const rbW = 160, rbH = 8, rbX = amX, rbY = amY + 28;
    ctx.fillStyle = '#333';
    ctx.fillRect(rbX, rbY, rbW, rbH);
    const progress = 1 - (p.reloadTimer / p.reloadDuration);
    ctx.fillStyle = '#ffaa00';
    ctx.fillRect(rbX, rbY, rbW * progress, rbH);
    ctx.fillStyle = '#fff';
    ctx.font = '9px monospace';
    ctx.fillText('RELOADING...', rbX + 40, rbY + 7);
  }

  // Level & kills (center)
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 14px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(`LEVEL ${game.level}`, W/2, 28);
  ctx.fillText(`KILLS: ${game.kills}/${game.targetKills}`, W/2, 46);

  // Score
  ctx.fillText(`SCORE: ${game.score}`, W/2, 64);
  ctx.textAlign = 'start';

  // Crosshair
  if (mouseOnCanvas) {
    const cx = mouse.x, cy = mouse.y;
    ctx.strokeStyle = '#ffffff88';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx - 10, cy); ctx.lineTo(cx - 4, cy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx + 4, cy); ctx.lineTo(cx + 10, cy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx, cy - 10); ctx.lineTo(cx, cy - 4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx, cy + 4); ctx.lineTo(cx, cy + 10); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, 3, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = '#ff444488';
    ctx.beginPath(); ctx.arc(cx, cy, 1.5, 0, Math.PI*2); ctx.fill();
  }
}

function renderMenu() {
  // Animated background particles
  if (game.frameCount % 3 === 0) {
    spawnParticle(rand(0,W), rand(0,H), rand(-15,15), rand(-15,15), rand(1,3), ['#e94560','#533483','#0f3460','#53a8b6'][randInt(0,3)], rand(1,3));
  }
  for (const pt of particles) {
    if (!pt.active) continue;
    const alpha = pt.life / pt.maxLife * 0.5;
    ctx.fillStyle = pt.color;
    ctx.globalAlpha = alpha;
    ctx.fillRect(pt.x, pt.y, pt.size, pt.size);
  }
  ctx.globalAlpha = 1;

  // Title (pixel-style)
  const titleY = 130;
  ctx.fillStyle = '#e94560';
  ctx.font = 'bold 52px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('TACTICAL', W/2, titleY);
  ctx.fillStyle = '#53a8b6';
  ctx.fillText('SHOOTER', W/2, titleY + 54);

  // Subtitle
  ctx.fillStyle = '#888';
  ctx.font = '14px monospace';
  ctx.fillText('A PIXEL-ART SURVIVAL GAME', W/2, titleY + 85);

  // Decorative skulls
  ctx.font = '28px monospace';
  ctx.fillText('💀', W/2 - 160, titleY + 30);
  ctx.fillText('💀', W/2 + 160, titleY + 30);

  // Controls info
  ctx.fillStyle = '#aaa';
  ctx.font = '12px monospace';
  const infoY = titleY + 140;
  ctx.fillText('ARROW KEYS / WASD — MOVE', W/2, infoY);
  ctx.fillText('MOUSE — AIM', W/2, infoY + 22);
  ctx.fillText('LEFT CLICK — SHOOT', W/2, infoY + 44);
  ctx.fillText('R — RELOAD', W/2, infoY + 66);

  // Start button
  const btnW = 220, btnH = 50, btnX = W/2 - btnW/2, btnY = infoY + 110;
  const hover = mouse.x >= btnX && mouse.x <= btnX + btnW && mouse.y >= btnY && mouse.y <= btnY + btnH;
  ctx.fillStyle = hover ? '#ff5a78' : '#e94560';
  ctx.fillRect(btnX, btnY, btnW, btnH);
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.strokeRect(btnX, btnY, btnW, btnH);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 20px monospace';
  ctx.fillText('START GAME', W/2, btnY + 33);
  ctx.textAlign = 'start';

  // Handle click
  if (mouse.down && hover) {
    startGame();
  }
}

function renderLevelTransition() {
  ctx.fillStyle = '#000000aa';
  ctx.fillRect(0, 0, W, H);

  const g = game;
  const isLast = g.level > LEVELS.length;
  ctx.fillStyle = isLast ? '#ffd700' : '#ffffff';
  ctx.font = 'bold 36px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(isLast ? 'FINAL LEVEL COMPLETE!' : `LEVEL ${g.level - 1} COMPLETE!`, W/2, H/2 - 30);

  ctx.fillStyle = '#aaa';
  ctx.font = '16px monospace';
  if (!isLast) {
    ctx.fillText(`NEXT LEVEL IN ${Math.ceil(g.transitionTimer)}...`, W/2, H/2 + 20);
  } else {
    ctx.fillText('PREPARE FOR VICTORY...', W/2, H/2 + 20);
  }
  ctx.textAlign = 'start';
}

function renderGameOver() {
  ctx.fillStyle = game.won ? '#000000cc' : '#200000cc';
  ctx.fillRect(0, 0, W, H);

  const won = game.won;
  ctx.fillStyle = won ? '#ffd700' : '#ff2222';
  ctx.font = 'bold 48px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(won ? 'YOU SURVIVED!' : 'GAME OVER', W/2, H/2 - 60);

  ctx.fillStyle = '#fff';
  ctx.font = '18px monospace';
  ctx.fillText(`FINAL SCORE: ${game.score}`, W/2, H/2 - 10);
  ctx.fillText(`TOTAL KILLS: ${game.totalKills}`, W/2, H/2 + 20);

  // Restart button
  const btnW = 220, btnH = 44, btnX = W/2 - btnW/2, btnY = H/2 + 50;
  const hover = mouse.x >= btnX && mouse.x <= btnX + btnW && mouse.y >= btnY && mouse.y <= btnY + btnH;
  ctx.fillStyle = hover ? '#ff5a78' : '#e94560';
  ctx.fillRect(btnX, btnY, btnW, btnH);
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.strokeRect(btnX, btnY, btnW, btnH);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 18px monospace';
  ctx.fillText('PLAY AGAIN', W/2, btnY + 30);

  ctx.fillStyle = '#888';
  ctx.font = '12px monospace';
  ctx.fillText('PRESS M FOR MENU', W/2, btnY + 62);
  ctx.textAlign = 'start';

  // Handle click
  if (mouse.down && hover && game.gameOverTimer <= 0) {
    startGame();
  }
  // M for menu
  if (keys.has('m') && game.gameOverTimer <= 0) {
    game.state = 'MENU';
    game.player = null;
    game.enemies = [];
    game.bullets = [];
    for (const p of particles) p.active = false;
  }

  if (game.gameOverTimer > 0) game.gameOverTimer -= 1/60;
}

// ─── MAIN LOOP ──────────────────────────────────
let lastTime = performance.now();

function loop(timestamp) {
  let dt = (timestamp - lastTime) / 1000;
  if (dt <= 0) dt = 1/60;
  lastTime = timestamp;

  game.frameCount++;

  // Consume click
  const clicked = mouse.down;
  // Update
  update(dt);

  // Render
  render();

  requestAnimationFrame(loop);
}

// Initialize
requestAnimationFrame(loop);
</script>
</body>
</html>
