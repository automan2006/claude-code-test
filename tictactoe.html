<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic Tac Toe</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #1a1a2e;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }
  .game {
    text-align: center;
    background: #16213e;
    padding: 2rem;
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }
  h1 { color: #e94560; margin-bottom: 0.5rem; font-size: 2rem; }
  .status {
    color: #a2a8d3;
    font-size: 1.2rem;
    margin-bottom: 1rem;
    min-height: 1.8em;
  }
  .board {
    display: grid;
    grid-template-columns: repeat(3, 100px);
    grid-template-rows: repeat(3, 100px);
    gap: 6px;
    margin-bottom: 1.5rem;
  }
  .cell {
    background: #0f3460;
    border: none;
    border-radius: 8px;
    font-size: 2.5rem;
    font-weight: bold;
    color: #e94560;
    cursor: pointer;
    transition: background 0.2s;
  }
  .cell:hover { background: #1a4a7a; }
  .cell.x { color: #e94560; }
  .cell.o { color: #53a8b6; }
  .cell.win { background: #2d6a4f; animation: pulse 0.6s infinite alternate; }
  @keyframes pulse { to { background: #40916c; } }
  .reset {
    background: #e94560;
    color: #fff;
    border: none;
    padding: 0.7rem 2rem;
    font-size: 1rem;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .reset:hover { background: #d63851; }
</style>
</head>
<body>
<div class="game">
  <h1>Tic Tac Toe</h1>
  <div class="status" id="status">Player X's turn</div>
  <div class="board" id="board"></div>
  <button class="reset" id="reset">New Game</button>
</div>

<script>
  const board = ['','','','','','','','',''];
  let current = 'X';
  let over = false;

  const wins = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  const statusEl = document.getElementById('status');
  const boardEl = document.getElementById('board');

  function checkWin() {
    for (const [a,b,c] of wins) {
      if (board[a] && board[a] === board[b] && board[b] === board[c]) {
        return { winner: board[a], cells: [a,b,c] };
      }
    }
    return null;
  }

  function render() {
    boardEl.innerHTML = '';
    for (let i = 0; i < 9; i++) {
      const cell = document.createElement('button');
      cell.className = 'cell';
      if (board[i]) cell.classList.add(board[i].toLowerCase());
      cell.textContent = board[i];
      cell.onclick = () => move(i);
      boardEl.appendChild(cell);
    }
  }

  function move(i) {
    if (over || board[i]) return;
    board[i] = current;

    const result = checkWin();
    if (result) {
      over = true;
      render();
      highlightWin(result.cells);
      statusEl.textContent = `Player ${result.winner} wins!`;
      return;
    }
    if (board.every(c => c)) {
      over = true;
      render();
      statusEl.textContent = "It's a draw!";
      return;
    }

    current = current === 'X' ? 'O' : 'X';
    statusEl.textContent = `Player ${current}'s turn`;
    render();
  }

  function highlightWin(cells) {
    for (const i of cells) {
      boardEl.children[i].classList.add('win');
    }
  }

  function reset() {
    board.fill('');
    current = 'X';
    over = false;
    statusEl.textContent = "Player X's turn";
    render();
  }

  document.getElementById('reset').onclick = reset;
  render();
</script>
</body>
</html>
